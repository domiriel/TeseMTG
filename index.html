<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG-Vis</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="FilterPanel"></div>
      <div class="TimelineView"></div>
      <div class="Title">
        <span class="dashboard-title">MTG-Vis</span>
        <div id="inlineLoader">
          <div class="spinner"></div>
          <span class="loader-text">Loading...</span>
        </div>
      </div>
      <div class="IcicleChart"></div>  <!-- Previously div5 -->
      <div class="LineChart"></div>
      <div class="AlluvialChart"></div> <!-- Previously div7 -->
      <div class="Scatterplot"></div>
    </div>
    <div class="HiddenDrawerArea"></div>
    <div class="IllegalDrawerArea"></div>

    <div id="tooltip" ></div>

  </body>
</html>
